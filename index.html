<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facturi AI</title><style>body{font-family:-apple-system,Arial;margin:18px;background:#f5f7fb;color:#17243b}main{max-width:650px;margin:auto}h1{font-size:27px}label{display:block;margin-top:14px;font-weight:600}input,button{box-sizing:border-box;width:100%;font-size:17px;padding:13px;margin-top:6px;border-radius:10px;border:1px solid #bdc9d8}button{background:#1454ad;color:white;font-weight:bold;border:0;margin-top:18px}button:disabled{opacity:.5}img{max-width:100%;max-height:500px;object-fit:contain;margin-top:12px}small{display:block;color:#556;margin:10px 0}#status{white-space:pre-wrap}section{background:white;padding:16px;border-radius:15px;margin:15px 0}</style></head><body><main><h1>📄 Facturi AI</h1><section><label>Fotografiază factura</label><input id="camera" type="file" accept="image/*" capture="environment"><label>Sau alege din galerie / Fișiere</label><input id="file" type="file" accept="image/*"><img id="preview" alt=""><button id="scan" disabled>🔎 Citește automat factura (OCR)</button><p id="status">Alege o fotografie pentru a începe.</p><small>OCR-ul rulează pe dispozitiv, prin Tesseract.js. Necesită internet pentru încărcarea motorului și poate greși; verifică toate datele înainte de salvare. Fotografia nu este trimisă către un server de procesare de această aplicație.</small></section><section><label>Furnizor</label><input id="supplier" placeholder="Numele firmei"><label>Număr factură</label><input id="number"><label>Data facturii</label><input id="date" placeholder="ZZ.LL.AAAA"><label>Total (RON)</label><input id="total" inputmode="decimal"><label>Text recunoscut (poți copia/verifica)</label><textarea id="raw" style="width:100%;height:170px"></textarea><button id="save">💾 Salvează factura</button><button id="export">⬇️ Export CSV</button><p id="count"></p></section></main><script>
const $=id=>document.getElementById(id);let selected=null;const entries=JSON.parse(localStorage.getItem('facturi-ai-v2')||'[]');function update(){$('count').textContent=entries.length+' facturi salvate pe acest dispozitiv.'}update();
function choose(e){const f=e.target.files?.[0];if(!f)return;selected=f;$('preview').src=URL.createObjectURL(f);$('scan').disabled=false;$('status').textContent='Fotografia este pregătită.'} $('camera').addEventListener('change',choose);$('file').addEventListener('change',choose);
function loadScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Nu s-a putut încărca motorul OCR. Verifică internetul.'));document.head.appendChild(s)})}
$('scan').onclick=async()=>{if(!selected)return;$('scan').disabled=true;try{$('status').textContent='Se încarcă motorul OCR...';if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');$('status').textContent='Se citește fotografia... poate dura 10–60 secunde.';const result=await Tesseract.recognize(selected,'ron+eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent='Citire: '+Math.round(m.progress*100)+'%'}});const t=result.data.text;$('raw').value=t;const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);const invoice=t.match(/(?:factur[aă]|invoice)\s*(?:nr\.?|no\.?|seria)?\s*[:#-]?\s*([A-Z0-9/-]{3,})/i);const date=t.match(/\b(\d{2}[./-]\d{2}[./-]\d{4})\b/);const totals=[...t.matchAll(/(?:total(?:\s+de\s+plat[aă])?|total\s+plata)\s*[:\s]*([\d., ]{3,})/gi)];if(invoice)$('number').value=invoice[1];if(date)$('date').value=date[1];if(totals.length)$('total').value=totals[totals.length-1][1].trim();if(lines.length&&!$('supplier').value)$('supplier').value=lines[0];$('status').textContent='Citire terminată. Verifică și corectează câmpurile; recunoașterea nu este garantată.'}catch(e){$('status').textContent='Eroare OCR: '+e.message}finally{$('scan').disabled=false}};
$('save').onclick=()=>{if(!$('supplier').value&&!$('number').value&&!$('raw').value){alert('Completează sau scanează o factură.');return}entries.push({furnizor:$('supplier').value,numar:$('number').value,data:$('date').value,total:$('total').value,text:$('raw').value});localStorage.setItem('facturi-ai-v2',JSON.stringify(entries));update();alert('Factura a fost salvată pe acest dispozitiv.')};
$('export').onclick=()=>{const cols=['furnizor','numar','data','total','text'];const csv='\uFEFF'+[cols.join(';'),...entries.map(r=>cols.map(k=>'"'+String(r[k]||'').replaceAll('"','""')+'"').join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='facturi.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
</script></body></html>
